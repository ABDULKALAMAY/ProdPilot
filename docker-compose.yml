services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: prodpilot
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')", "--quiet"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGO_URI: mongodb://mongo:27017/prodpilot
      JWT_SECRET: ${JWT_SECRET}
      CLIENT_ORIGIN: http://localhost:8040
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "5000:5000"

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
      args:
        # The browser calls the API exposed from the same development machine.
        VITE_API_URL: http://localhost:5000
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "8040:80"

volumes:
  mongo_data:
