services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: prodpilot
    volumes:
      - mongo_data:/data/db
    ports:
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')", "--quiet"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGO_URI: mongodb://mongo:27017/prodpilot
      JWT_SECRET: ${JWT_SECRET:?Copy .env.example to .env and set JWT_SECRET before starting}
      CLIENT_ORIGIN: http://localhost:${CLIENT_PORT:-8040}
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_PORT:-5000}:5000"

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "${CLIENT_PORT:-8040}:80"

volumes:
  mongo_data:
